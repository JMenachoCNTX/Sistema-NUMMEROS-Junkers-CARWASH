<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1419">
<title>Ingresar · Junkers Car Wash</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<main class="login">
  <div class="login-caja">
    <div class="marca">JUNKERS<br><span>CAR WASH</span></div>
    <div class="marca-sub">Sistema interno</div>

    <div style="margin-top:24px">
      <label class="campo">
        <span>Usuario</span>
        <select id="usuario"><option>Cargando…</option></select>
      </label>
    </div>

    <div class="pin-puntos" id="puntos">
      <div class="pin-punto"></div><div class="pin-punto"></div>
      <div class="pin-punto"></div><div class="pin-punto"></div>
    </div>

    <div class="teclado" id="teclado">
      <button class="tecla" data-t="1">1</button>
      <button class="tecla" data-t="2">2</button>
      <button class="tecla" data-t="3">3</button>
      <button class="tecla" data-t="4">4</button>
      <button class="tecla" data-t="5">5</button>
      <button class="tecla" data-t="6">6</button>
      <button class="tecla" data-t="7">7</button>
      <button class="tecla" data-t="8">8</button>
      <button class="tecla" data-t="9">9</button>
      <button class="tecla util" data-t="limpiar">Limpiar</button>
      <button class="tecla" data-t="0">0</button>
      <button class="tecla util" data-t="borrar">←</button>
    </div>

    <p class="hint" id="mensaje" style="text-align:center;margin-top:16px;min-height:18px"></p>
  </div>
</main>

<script type="module">
import { auth, db, collection, getDocs, query, where,
         signInWithEmailAndPassword, correoDe, claveDe } from "./js/firebase.js";

const $usuario = document.getElementById('usuario');
const $puntos  = document.getElementById('puntos');
const $mensaje = document.getElementById('mensaje');
let pin = '', ocupado = false;

function pintar() {
  [...$puntos.children].forEach((p, i) => p.classList.toggle('lleno', i < pin.length));
}
function fallar(txt) {
  $mensaje.textContent = txt;
  $puntos.classList.add('error');
  setTimeout(() => $puntos.classList.remove('error'), 320);
  pin = ''; pintar();
}

// Directorio público: solo nombre visible y usuario de acceso.
try {
  const snap = await getDocs(query(collection(db, 'directorio'), where('activo', '==', true)));
  const filas = snap.docs.map(d => d.data()).sort((a, b) => a.nombre.localeCompare(b.nombre));
  if (!filas.length) {
    $usuario.innerHTML = '<option value="">Sin usuarios creados</option>';
    $mensaje.textContent = 'Abrí scripts/crear-admin.html para crear el primer administrador.';
  } else {
    $usuario.innerHTML = filas
      .map(u => `<option value="${u.usuario}">${u.nombre}</option>`).join('');
    const ultimo = localStorage.getItem('jk_ultimo_usuario');
    if (ultimo && filas.some(u => u.usuario === ultimo)) $usuario.value = ultimo;
  }
} catch (e) {
  $usuario.innerHTML = '<option value="">Sin conexión</option>';
  $mensaje.textContent = 'No se pudo leer el directorio. Revisá js/firebase-config.js.';
  console.error(e);
}

async function entrar() {
  if (ocupado) return;
  const usuario = $usuario.value;
  if (!usuario) return fallar('Elegí un usuario.');
  ocupado = true;
  $mensaje.textContent = 'Verificando…';
  try {
    await signInWithEmailAndPassword(auth, correoDe(usuario), claveDe(pin));
    localStorage.setItem('jk_ultimo_usuario', usuario);
    location.replace('app.html');
  } catch (e) {
    ocupado = false;
    if (e.code === 'auth/too-many-requests') fallar('Demasiados intentos. Esperá un momento.');
    else fallar('PIN incorrecto.');
  }
}

function marcar(t) {
  if (ocupado) return;
  if (t === 'borrar') pin = pin.slice(0, -1);
  else if (t === 'limpiar') pin = '';
  else if (pin.length < 4) { pin += t; $mensaje.textContent = ''; }
  pintar();
  if (pin.length === 4) entrar();
}

document.getElementById('teclado').addEventListener('click', e => {
  const b = e.target.closest('.tecla');
  if (b) marcar(b.dataset.t);
});
addEventListener('keydown', e => {
  if (/^[0-9]$/.test(e.key)) marcar(e.key);
  else if (e.key === 'Backspace') marcar('borrar');
  else if (e.key === 'Enter' && pin.length === 4) entrar();
});
</script>
</body>
</html>
